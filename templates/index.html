<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Journal</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Trading Journal</h1>
    <p class="subtitle">Simple stock market journal with login and trade tracking</p>

    <section class="card">
      <h2>Register / Login</h2>

      <div class="grid">
        <div>
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Enter username" />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" />
        </div>
      </div>

      <div class="actions">
        <button id="registerBtn">Register</button>
        <button id="loginBtn" class="secondary">Login</button>
      </div>

      <p id="sessionMessage" class="message"></p>
      <p id="authMessage" class="message"></p>
    </section>

    <section class="card">
      <h2>Add Trade</h2>

      <div class="grid">
        <div>
          <label for="ticker">Ticker</label>
          <input id="ticker" type="text" placeholder="AAPL" />
        </div>

        <div>
          <label for="direction">Direction</label>
          <select id="direction">
            <option value="Long">Long</option>
            <option value="Short">Short</option>
          </select>
        </div>

        <div>
          <label for="entryPrice">Entry Price</label>
          <input id="entryPrice" type="number" step="0.01" placeholder="100.50" />
        </div>

        <div>
          <label for="exitPrice">Exit Price</label>
          <input id="exitPrice" type="number" step="0.01" placeholder="105.00" />
        </div>

        <div>
          <label for="quantity">Quantity</label>
          <input id="quantity" type="number" step="0.01" placeholder="10" />
        </div>

        <div>
          <label for="notes">Notes</label>
          <input id="notes" type="text" placeholder="Breakout with volume" />
        </div>
      </div>

      <div class="actions">
        <button id="addTradeBtn">Add Trade</button>
      </div>

      <p id="tradeMessage" class="message"></p>
    </section>

    <section class="card">
      <h2>Trades</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Ticker</th>
            <th>Direction</th>
            <th>Entry</th>
            <th>Exit</th>
            <th>Quantity</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="tradesTableBody"></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
